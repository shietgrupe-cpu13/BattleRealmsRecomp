name: BattleRealmsRecomp source safety

on:
  push:
    branches: [main, "ci/**", android-new]
    paths:
      - ".github/workflows/android-recomp.yml"
      - "runtime/**"
      - "tools/**"
      - "android/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-recomp.yml"
      - "runtime/**"
      - "tools/**"
      - "android/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-source-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject proprietary files and generated game code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          forbidden_exts = {".exe", ".dll", ".h2o", ".bre", ".dat", ".wav", ".mp3", ".dds", ".tga", ".bmp", ".sav", ".apk", ".aab"}
          forbidden_dirs = {"generated", "game", "gamefiles", "game_data", "original_assets", "references", "deps", "build", ".cxx"}
          allowed_build_metadata = {"tools/lifted/CMakeLists.txt"}
          bad = []
          for name in filter(None, tracked):
              path = PurePosixPath(name)
              if path.suffix.lower() in forbidden_exts or (name not in allowed_build_metadata and any(part.lower() in forbidden_dirs | {"lifted"} for part in path.parts)):
                  bad.append(name)
          if bad:
              print("::error::Private game inputs, generated code, or build outputs are tracked:")
              print("\n".join(sorted(set(bad))))
              raise SystemExit(1)
          print(f"Source boundary passed for {len([x for x in tracked if x])} tracked files.")
          PY

      - name: Check Python tools compile
        run: python3 -m compileall -q tools

      - name: Test runtime-observed guest root validation
        run: python3 tests/runtime_roots_smoke.py

      - name: Test dispatch-site diagnostics and differential suite tooling
        run: |
          python3 tests/dispatch_site_trace_smoke.py
          python3 tests/unicorn_differential_suite_smoke.py
          python3 tests/backward_jump_table_patch_smoke.py
          python3 tests/lifted_function_overlay_smoke.py
          python3 -m py_compile tools/trace_generated_dispatch_sites.py tools/create_dispatch_trace_overlay.py tools/compare_lifted_x86_block.py tools/patch_ra3_backward_jump_tables.py tools/extract_lifted_functions.py tools/compare_6a1240_jump_targets.py

      - name: Run D3D7 renderer component regression
        run: bash tests/run_renderer_component_tests.sh

      - name: Check launcher manifest and Gradle project are present
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f runtime/pe32_loader/CMakeLists.txt
          test -f tools/recompile.py
          test -f tests/run_host_tests.sh

      - name: Record build boundary
        run: |
          {
            echo "## Source safety result"
            echo
            echo "This public job contains no proprietary executable, game assets, generated lifted code, APK, or private runtime logs."
            echo "The actual ARM64 compilation and APK packaging run in the separate private builder repository."
            echo "This check is not a Battle Realms gameplay test."
          } >> "$GITHUB_STEP_SUMMARY"
