name: BattleRealmsRecomp public CI

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/android-recomp.yml"
      - "runtime/**"
      - "tools/**"
      - "android/**"
      - "tests/**"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-recomp.yml"
      - "runtime/**"
      - "tools/**"
      - "android/**"
      - "tests/**"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-realms-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-and-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject restricted inputs and generated game code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked = [x for x in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if x]
          forbidden_exts = {".exe", ".dll", ".h2o", ".bre", ".dat", ".wav", ".mp3", ".dds", ".tga", ".bmp", ".sav", ".apk", ".aab", ".o", ".so"}
          forbidden_dirs = {"generated", "game", "gamefiles", "game_data", "original_assets", "references", "deps", "build", ".cxx", "lifted"}
          allowed_build_metadata = {"tools/lifted/CMakeLists.txt"}
          bad = []
          for name in tracked:
              path = PurePosixPath(name)
              restricted_path = any(part.lower() in forbidden_dirs for part in path.parts)
              if path.suffix.lower() in forbidden_exts or (restricted_path and name not in allowed_build_metadata):
                  bad.append(name)
          if bad:
              print("::error::Restricted inputs, generated game code, or build outputs are tracked:")
              print("\n".join(sorted(set(bad))))
              raise SystemExit(1)
          print(f"Public source boundary passed for {len(tracked)} tracked files.")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned Python test dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - name: Run Python and dispatch regression tests
        run: |
          python3 -m compileall -q tools tests
          python3 tests/runtime_roots_smoke.py
          python3 tests/incremental_runtime_lift_smoke.py
          python3 tests/dispatch_coverage_smoke.py
          python3 tests/dispatch_site_trace_smoke.py
          python3 tests/lift_object_inventory_smoke.py
          python3 tests/unicorn_differential_suite_smoke.py
          python3 tests/backward_jump_table_patch_smoke.py
          python3 tests/lifted_function_overlay_smoke.py

      - name: Run graphics and audio component regressions
        run: bash tests/run_renderer_component_tests.sh

      - name: Validate Android project source layout
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f runtime/pe32_loader/CMakeLists.txt
          test -f tools/recompile.py
          test -f tests/public_lift_pipeline_smoke.py

      - name: Report public-only test scope
        run: |
          {
            echo "## Public source and component validation"
            echo
            echo "This job receives no private game-input token and handles no Battle Realms executable, assets, generated game code, or APK."
            echo "The separate native pipeline job uses only a checked-in synthetic PE32 fixture."
          } >> "$GITHUB_STEP_SUMMARY"

  public-native-arm64-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake ninja-build ccache
          ccache --version
          clang --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install analysis Python dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install pinned Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;36.1.0' 'cmake;3.22.1' 'ndk;28.2.13676358'

      - name: Restore safe public compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/br-public-ccache
          key: br-public-ccache-v1-${{ runner.os }}-ndk28.2.13676358-ra3-b46328a6-cap04fd70b5-${{ hashFiles('runtime/**', 'tools/lifted/CMakeLists.txt', 'tests/fixtures/public_lift_fixture.c') }}
          restore-keys: |
            br-public-ccache-v1-${{ runner.os }}-ndk28.2.13676358-ra3-b46328a6-cap04fd70b5-

      - name: Restore content-addressed synthetic lift cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/br-public/generated
          key: br-public-lift-v1-${{ hashFiles('tests/fixtures/public_lift_fixture.c') }}-${{ hashFiles('tests/public_lift_pipeline_smoke.py', 'tools/recompile.py', 'tools/runtime_roots.py', 'tools/patch_generated_x86_compat.py') }}-ra3-b46328a6-cap04fd70b5-u4
          restore-keys: |
            br-public-lift-v1-${{ hashFiles('tests/fixtures/public_lift_fixture.c') }}-

      - name: Build pinned analyzer and lifter dependencies
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR="$RUNNER_TEMP/br-public-ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE:$RUNNER_TEMP"
          mkdir -p "$CCACHE_DIR"
          ccache -z
          git clone --filter=blob:none --no-checkout https://github.com/blackorange-sketch/RA3-Native.git "$RUNNER_TEMP/RA3-Native"
          git -C "$RUNNER_TEMP/RA3-Native" checkout --detach b46328a6ec6f52ce20db61a73e9f7aab3c5b3b90
          git clone --filter=blob:none --no-checkout https://github.com/capstone-engine/capstone.git "$RUNNER_TEMP/capstone"
          git -C "$RUNNER_TEMP/capstone" checkout --detach 04fd70b5456c20fc27d1f2b62d6ed0820fc6b081
          cmake -S "$RUNNER_TEMP/capstone" -B "$RUNNER_TEMP/capstone-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
            -DCAPSTONE_X86_SUPPORT=ON -DCAPSTONE_BUILD_SHARED_LIBS=OFF \
            -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_CSTEST=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF
          cmake --build "$RUNNER_TEMP/capstone-build" --parallel 2
          ccache c++ -O2 -std=c++17 -I"$RUNNER_TEMP/capstone/include" \
            "$RUNNER_TEMP/RA3-Native/tools/analyze.cpp" "$RUNNER_TEMP/capstone-build/libcapstone.a" \
            -o "$RUNNER_TEMP/analyze"
          ccache c++ -O2 -std=c++17 -I"$RUNNER_TEMP/capstone/include" \
            "$RUNNER_TEMP/RA3-Native/tools/lift.cpp" "$RUNNER_TEMP/RA3-Native/tools/lift_pe.cpp" \
            "$RUNNER_TEMP/capstone-build/libcapstone.a" -o "$RUNNER_TEMP/lift_pe"
          mkdir -p references
          ln -s "$RUNNER_TEMP/RA3-Native" references/RA3-Native
          echo "Pinned analyzer/lifter and Capstone built; no game input was fetched."

      - name: Exercise analysis, lifting, deterministic reuse, and invalidation
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR="$RUNNER_TEMP/br-public-ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE:$RUNNER_TEMP"
          python tests/public_lift_pipeline_smoke.py \
            --analyze "$RUNNER_TEMP/analyze" \
            --lift "$RUNNER_TEMP/lift_pe" \
            --workspace "$RUNNER_TEMP/br-public"
          echo "BR_PUBLIC_GENERATED=$RUNNER_TEMP/br-public/generated/main4_export_seeded" >> "$GITHUB_ENV"

      - name: Configure Android SDK and NDK toolchain
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/br-public-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE:$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Compile synthetic lifted functions for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/lifted -B "$RUNNER_TEMP/br-public-lift-arm64" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DRA3_RUNTIME_DIR="$RUNNER_TEMP/RA3-Native/runtime" \
            -DLIFTED_DIR="$BR_PUBLIC_GENERATED" -DBR_USE_CCACHE=ON
          cmake --build "$RUNNER_TEMP/br-public-lift-arm64" --target battle_realms_lifted --parallel 2

      - name: Compile Android ARM64 compatibility runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake -S runtime/pe32_loader -B "$RUNNER_TEMP/br-public-runtime-arm64" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DRA3_RUNTIME_DIR="$RUNNER_TEMP/RA3-Native/runtime" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$RUNNER_TEMP/br-public-runtime-arm64" --target br_game_runtime pe32_loader_smoke --parallel 2
          object=$(find "$RUNNER_TEMP/br-public-runtime-arm64" -name pe32_image.cpp.o -print -quit)
          test -n "$object"
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$object" | grep -q AArch64

      - name: Report public cache statistics
        if: always()
        run: |
          {
            echo "## Public game-free ARM64 recompilation pipeline"
            echo
            echo "Input: synthetic PE32 fixture only. No Battle Realms binary or game-derived output was fetched, cached, or uploaded."
            echo
            if [ -f "$RUNNER_TEMP/br-public/public_lift_pipeline_report.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/br-public/public_lift_pipeline_report.json"
              echo '```'
            fi
            echo
            echo '### ccache statistics (public runtime and synthetic fixture only)'
            echo '```'
            ccache -s || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save safe public compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/br-public-ccache
          key: br-public-ccache-v1-${{ runner.os }}-ndk28.2.13676358-ra3-b46328a6-cap04fd70b5-${{ hashFiles('runtime/**', 'tools/lifted/CMakeLists.txt', 'tests/fixtures/public_lift_fixture.c') }}

      - name: Save synthetic generated-source cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/br-public/generated
          key: br-public-lift-v1-${{ hashFiles('tests/fixtures/public_lift_fixture.c') }}-${{ hashFiles('tests/public_lift_pipeline_smoke.py', 'tools/recompile.py', 'tools/runtime_roots.py', 'tools/patch_generated_x86_compat.py') }}-ra3-b46328a6-cap04fd70b5-u4


      - name: Upload public-safe verification report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BattleRealmsRecomp-public-safe-ci-${{ github.run_number }}
          path: ${{ runner.temp }}/br-public/public_lift_pipeline_report.json
          retention-days: 7
